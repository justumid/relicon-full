services:
  # Next.js Frontend
  - type: web
    name: relicon-frontend
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RUNWAY_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: VIDEO_PROVIDER
        value: luma
      - key: AUDIO_PROVIDER
        value: elevenlabs
      - key: TEXT_PROVIDER
        value: openai
      - key: MOCK_MODE
        value: false
      - key: ADMIN_API_KEY
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ENGINE_URL
        fromService:
          type: web
          name: relicon-backend
          property: host

  # Python FastAPI Backend
  - type: web
    name: relicon-backend
    runtime: python
    buildCommand: pip install -r engine/requirements.txt
    startCommand: cd engine && python server.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: OPENAI_API_KEY
        sync: false
      - key: LUMA_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: RUNWAY_API_KEY
        sync: false
      - key: MOCK_MODE
        value: false
      - key: ALLOWED_ORIGINS
        sync: false
