# Multi-language support: Node.js + Python
[phases.setup]
nixPkgs = ["nodejs_20", "python311", "python311Packages.pip"]

[phases.install]
cmds = ["npm install -g pnpm@9 && pnpm install --frozen-lockfile"]

[phases.build]
cmds = [
  "pnpm build",
  "cd engine && pip install -r requirements.txt --break-system-packages"
]

[start]
cmd = "cd engine && python3 static_server.py"
