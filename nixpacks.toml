[phases.setup]
nixPkgs = ["nodejs", "python3", "python3Packages.pip"]

[phases.install]
cmds = [
  "npm install",
  "cd engine && (python -m venv venv && source venv/bin/activate && pip install -r requirements.txt) || pip install -r requirements.txt --break-system-packages"
]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "cd engine && (source venv/bin/activate 2>/dev/null || true) && python static_server.py"
